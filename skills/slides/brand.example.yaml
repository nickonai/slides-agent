# Бренд-конфигурация презентаций.
#
# Скопируйте этот файл под именем brand.yaml в корень рабочей папки
# (или в папку конкретной презентации — тогда он перебьёт общий)
# и поправьте. Указывать нужно только то, что отличается от дефолтов.
#
# Заполненный пример — presets/univerus/brand.yaml.

# Название бренда: идёт в заголовок вкладки HTML-дека.
name: "Моя школа"

# Слово рядом со знаком в колонтитуле каждого слайда и на титуле.
# Пусто — колонтитул без названия, только номер слайда.
wordmark: "моя школа"

# Домен без протокола. Подставляется в адресную строку макета браузера
# вокруг скриншотов, если у слайда нет своего поля url.
site: "example.com"

# Текст жёлтой плашки на финальном слайде (closing), если в слайде нет поля cta.
cta: "example.com"

# Надстрочная метка титульного слайда, если в слайде нет поля eyebrow.
eyebrow: "Презентация · Моя школа"

logo:
  # Одноцветный SVG-знак (лучше с fill="currentColor" — тогда он
  # перекрашивается под светлый и тёмный фон). Относительный путь
  # считается от папки этого файла. Пусто — без знака.
  mark: "logo-mark.svg"

# Фоновый мотив: тот же знак крупно и почти прозрачно у края слайда.
# false — фон без мотива.
motif: true

palette:
  primary: "#3785e2"   # основной цвет: номера, точки, акценты на светлом
  sky: "#4ba7f9"       # светлый акцент: знак, мотив, градиент финала
  deep: "#2a6fc4"      # тёмный край градиента финального слайда
  accent: "#d0ea50"    # плашки и метки на тёмном фоне
  ink: "#080d18"       # фон тёмных слайдов
  ink_2: "#131b2e"     # карточки на тёмном
  ink_3: "#1c273f"     # шапка макета браузера
  paper: "#f5f2eb"     # фон светлых слайдов
  bone: "#faf8f3"      # фон слайда-кейса
  danger: "#e0444a"    # значок ✕

fonts:
  # Папка с fonts.json и woff2-файлами (см. scripts/fetch_fonts.py).
  # Шрифты вшиваются в дек, поэтому он открывается без интернета.
  dir: "assets/fonts"
  display: "Unbounded"      # заголовки
  sans: "Onest"             # основной текст
  mono: "JetBrains Mono"    # надстрочные метки
  # Если папка пуста — дек потянет шрифты по этой ссылке из сети.
  google_css: "https://fonts.googleapis.com/css2?family=Unbounded:wght@300..900&family=Onest:wght@300..800&family=JetBrains+Mono:wght@400..700&display=swap"

# Подписи слайда-кейса (тип case).
case:
  eyebrow: "Кейс"
  role: "участник программы"
  disclaimer: "Это результат конкретного человека, а не обещание вашего результата."
