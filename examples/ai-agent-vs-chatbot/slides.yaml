# Демо-презентация плагина slides-agent.
# Тема нейтральная, без людей, цен и цифр, которые требуют источника.
# Собрать: см. examples/README.md

- title: ИИ-АГЕНТ И ЧАТ-БОТ
  slide_type: title
  subtitle: В чём разница и что выбрать под свою задачу
  body:
    - Простыми словами
    - На примерах
    - Без кода
  presenter_notes: >
    Сегодня разберём, чем ИИ-агент отличается от привычного чат-бота
    и как понять, что нужно именно вам.

- title: О ЧЁМ ПОГОВОРИМ
  slide_type: agenda
  body:
    - Что умеет чат-бот
    - Что добавляет агент
    - Как агент работает по шагам
    - Когда что выбрать
  presenter_notes: Четыре коротких блока. В конце — простое правило выбора.

- title: ЧАТ-БОТ ОТВЕЧАЕТ. АГЕНТ ДЕЛАЕТ.
  slide_type: statement
  presenter_notes: >
    Это главная мысль всей презентации. Дальше разберём, что за ней стоит.

- title: ЧТО УМЕЕТ ЧАТ-БОТ
  slide_type: bullets
  body:
    - Отвечает на вопрос в диалоге
    - Пишет, объясняет, переводит
    - Каждый следующий шаг запускаете вы
    - 🎯 Результат — текст на экране
  presenter_notes: >
    Чат-бот — сильный собеседник. Но он ждёт вашего следующего сообщения
    и сам ничего не делает за пределами окна чата.

- title: В ЧЁМ РАЗНИЦА
  slide_type: comparison
  left_label: Чат-бот
  right_label: ИИ-агент
  left:
    - Ждёт следующего сообщения
    - Отдаёт только текст
    - Ошибку замечаете вы
  right:
    - Сам разбивает цель на шаги
    - Работает с файлами, поиском, программами
    - Проверяет результат и исправляет
  presenter_notes: >
    Слева — чат, справа — исполнитель. Разница не в «уме» модели,
    а в том, что агенту дали инструменты и право действовать.

- title: 3 ПРИЗНАКА АГЕНТА
  slide_type: stat
  body:
    - Получает цель, а не вопрос
    - Пользуется инструментами
    - Проверяет, что вышло
  presenter_notes: >
    Если у системы есть все три признака — это агент.
    Если только диалог — это чат-бот, каким бы умным он ни был.

- title: КАК РАБОТАЕТ АГЕНТ
  slide_type: steps
  body:
    - Получает цель
    - Составляет план
    - Действует инструментами
    - Проверяет результат
    - Отдаёт готовое
  presenter_notes: >
    Это цикл. Если на четвёртом шаге что-то не так,
    агент возвращается к третьему и переделывает.

- title: ПРИМЕР — ПРЕЗЕНТАЦИЯ ИЗ ТЕМЫ
  slide_type: feature
  subtitle: Как собрана эта презентация
  body:
    - Вы называете тему
    - Агент ищет источники и пишет план
    - Вы согласуете план
    - 🎯 Агент верстает и проверяет каждый слайд
  chain_title: Шаги агента
  chain:
    - Ресёрч по теме
    - План слайдов
    - Сценарий в YAML
    - Вёрстка дека
    - Проверка каждого слайда
  active: 4
  presenter_notes: >
    Эту презентацию собрал агент. Человек дал тему и согласовал план,
    остальные шаги агент прошёл сам и сам проверил результат.

- title: КОГДА ЧТО ВЫБРАТЬ
  slide_type: cards
  body:
    - Нужен ответ или текст — хватит чат-бота
    - Нужна работа из нескольких шагов — берите агента
    - Важный результат — проверяйте глазами в любом случае
  presenter_notes: >
    Не нужно везде ставить агента. Для короткого ответа чат быстрее.

- title: С ЧЕГО НАЧАТЬ
  slide_type: bullets
  body:
    - Выберите задачу, которую повторяете каждую неделю
    - Опишите цель и признак готовности
    - Дайте доступ только к нужным файлам
    - 🎯 Первый результат проверьте сами
  presenter_notes: >
    Лучший первый агент — для рутины, которую вы и так делаете руками.

- title: ПОПРОБУЙТЕ НА СВОЕЙ ЗАДАЧЕ
  slide_type: closing
  subtitle: Возьмите одну рутинную задачу и поручите её агенту
  body:
    - Одна задача
    - Понятная цель
    - Проверка результата
  presenter_notes: Спасибо! Попробуйте на одной задаче — и сравните с тем, как делали раньше.
